name: Windows M0 prototypes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run pi:install
      - run: npm run pi:hydrate
      - run: git diff --exit-code -- pi-model-data-lock.json
      - run: npm run pi:build
      - run: npm run pi:verify
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:native
      - run: node_modules/.bin/electron.cmd . --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-m0-results
          path: |
            .local/native-smoke.json
            .local/desktop-smoke.json
          if-no-files-found: ignore
