name: Windows desktop prototypes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: windows-latest
    # The expanded sequential package/recovery matrix reached installer checks
    # at the former 40-minute job limit. Individual test/process limits remain.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run pi:install
      - run: npm run pi:hydrate
      - run: git diff --exit-code -- pi-model-data-lock.json
      - run: npm run pi:build
      - run: npm run pi:verify
      - run: npm run typecheck
      - run: npm run build
      - run: dotnet build native/CommandDeck.Windowing/CommandDeck.Windowing.csproj -c Release -f net472 -p:RestoreLockedMode=true --nologo
      - run: dotnet build native/CommandDeck.AdapterBridge/CommandDeck.AdapterBridge.csproj -c Release -f net472 -p:RestoreLockedMode=true --nologo
      - run: npm test
      - name: Inspect publish input state
        run: |
          git status --porcelain=v1 --untracked-files=normal
          git submodule foreach --recursive git status --porcelain=v1 --untracked-files=normal
      - run: npm run publish:commands -- --output artifacts/portable-commands
      - run: npm run test:portable-command -- --source artifacts/portable-commands
      - run: npm run test:portable-pi -- --require-clean-source
      - run: npm run test:vault
      - run: npm run test:native
      - run: npm run test:process-cohort
      - run: npm run test:profile-lock
      - run: npm run test:ui-watchdog
      - run: npm run probe:native-hang
      - run: npm run probe:native-focus
      - run: npm run test:native-ui-recovery
      - run: npm run test:adapter-layout
      - run: npm run test:adapter-native
      - run: npm run test:adapter-bridge
      - run: npm run test:adapter-route
      - run: node scripts/run-desktop-smoke.mjs
      - run: node scripts/run-desktop-smoke.mjs --smoke-host-exit
      - run: node scripts/run-desktop-smoke.mjs --smoke-recovery-limit
      - run: npm run test:desktop-adapter
      - run: npm run test:workbench
      - run: npm run test:tray
      - run: npm run test:power
      - run: npm run test:journal
      - run: npm run test:renamed-ui
      - run: npm run test:bridge
      - run: npm run test:gateway
      - run: npm run test:observation
      - run: npm run test:game
      - run: npm run test:runtime-loss
      - run: npm run test:game-runtime-loss
      - run: npm run test:game-runtime-accepted
      - run: npm run test:game-runtime-planning
      - run: npm run test:game-mcp-accepted
      - run: npm run test:game-mcp-lost-ack
      - run: npm run test:diagnostics
      - run: npm run package:desktop -- --output artifacts/portable-desktop
      - run: npm run test:portable-desktop -- --source artifacts/portable-desktop --reopen-history
      - run: npm run test:packaged-popouts -- --source artifacts/portable-desktop
      - run: npm run test:packaged-journal-interruption -- --source artifacts/portable-desktop
      - run: npm run test:packaged-video-archive -- --source artifacts/portable-desktop
      - run: npm run test:packaged-video-archive -- --source artifacts/portable-desktop --coarse-clock
      - run: npm run test:packaged-gateway -- --source artifacts/portable-desktop
      - run: npm run test:profile-lock -- --source artifacts/portable-desktop
      - run: npm run test:startup-failure -- --source artifacts/portable-desktop
      - run: npm run test:legacy-recovery -- --source artifacts/portable-desktop
      - run: npm run test:full-profile-migration -- --source artifacts/portable-desktop
      - run: npm run test:packaged-os-storage -- --source artifacts/portable-desktop
      - run: npm run test:packaged-acl-storage -- --source artifacts/portable-desktop
      - run: npm run test:packaged-ledger-evidence -- --source artifacts/portable-desktop
      - run: npm run test:packaged-runtime-loss -- --source artifacts/portable-desktop
      - run: npm run test:packaged-mcp-loss -- --source artifacts/portable-desktop
      - run: npm run test:packaged-development-usage -- --source artifacts/portable-desktop
      - run: npm run test:packaged-development-context -- --source artifacts/portable-desktop
      - run: npm run test:packaged-development-context-interruption -- --source artifacts/portable-desktop
      - run: npm run test:packaged-development-context-providers -- --source artifacts/portable-desktop
      - run: npm run test:packaged-development-context-failures -- --source artifacts/portable-desktop
      - run: npm run test:packaged-diagnostics -- --source artifacts/portable-desktop
      - run: npm run test:packaged-storage -- --source artifacts/portable-desktop
      - run: npm run test:packaged-command -- --source artifacts/portable-desktop
      - run: npm run installer:toolchain
      - run: npm run package:installer -- --source artifacts/portable-desktop --output artifacts/installer
      - name: Build isolated installer candidate
        shell: pwsh
        run: |
          $installerTestId = [guid]::NewGuid().ToString()
          npm run package:installer -- --source artifacts/portable-desktop --output artifacts/installer-test --test-id $installerTestId
      - run: npm run test:installer -- --source artifacts/installer-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-m0-results
          path: |
            .local/native-smoke.json
            .local/process-cohort-observer.json
            .local/profile-lock-smoke.json
            .local/startup-failure-smoke.json
            .local/legacy-recovery-smoke.json
            .local/full-profile-migration-smoke.json
            .local/packaged-runtime-loss-smoke.json
            .local/packaged-mcp-loss-smoke.json
            .local/desktop-smoke-diagnostics.json
            .local/packaged-diagnostics-smoke.json
            .local/packaged-storage-smoke.json
            .local/packaged-os-storage-smoke.json
            .local/packaged-acl-storage-smoke.json
            .local/packaged-os-storage-failure.json
            .local/packaged-acl-storage-failure.json
            .local/packaged-ledger-evidence-smoke.json
            .local/packaged-command-smoke.json
            .local/packaged-development-usage-smoke.json
            .local/packaged-development-context-smoke.json
            .local/packaged-development-context-interruption-smoke.json
            .local/packaged-development-context-providers-smoke.json
            .local/packaged-development-context-failures-smoke.json
            .local/packaged-journal-interruption-smoke.json
            .local/packaged-video-archive-smoke.json
            .local/packaged-video-archive-coarse-smoke.json
            .local/packaged-gateway-smoke.json
            .local/desktop-smoke-game-mcp-accepted.json
            .local/desktop-smoke-game-mcp-lost-ack.json
            .local/desktop-smoke-runtime-loss.json
            .local/desktop-smoke-game-runtime-loss.json
            .local/desktop-smoke-game-runtime-accepted.json
            .local/desktop-smoke-game-runtime-planning.json
            .local/ui-watchdog-native.json
            .local/native-hang-probe.json
            .local/native-input-hang-probe.json
            .local/native-input-recovery-probe.json
            .local/desktop-smoke.json
            .local/desktop-smoke-host-exit.json
            .local/desktop-smoke-recovery-limit.json
            .local/adapter-native-smoke.json
            .local/adapter-bridge-smoke.json
            .local/adapter-layout-smoke.json
            .local/adapter-route-smoke.json
            .local/desktop-smoke-adapter.json
            .local/desktop-smoke-workbench.json
            .local/desktop-smoke-tray.json
            .local/desktop-smoke-power.json
            .local/desktop-smoke-journal.json
            .local/desktop-smoke-renamed-ui.json
            .local/credential-vault-smoke.json
            .local/desktop-smoke-bridge.json
            .local/desktop-smoke-gateway.json
            .local/desktop-smoke-observation.json
            .local/desktop-smoke-game.json
            .local/portable-command-smoke.json
            .local/portable-pi-smoke.json
            .local/portable-desktop-smoke.json
            .local/portable-desktop-application.json
            .local/installer-smoke.json
            artifacts/portable-desktop/commanddeck-bundle.json
            artifacts/portable-desktop/resources/app/dist/renderer/THIRD-PARTY-LICENSES.md
            artifacts/installer/commanddeck-installer.json
            artifacts/installer-test/commanddeck-installer.json
          if-no-files-found: ignore
